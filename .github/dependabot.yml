version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - composer
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
